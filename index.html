<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>라우어 시니어타운 | 공식 입주·상담 안내센터</title>
  
  <!-- Font Awesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

  <style>
    /* Global Reset & Base Typography */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      word-break: keep-all;
    }
    
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      color: #2c3036;
      background-color: #f7f9fa;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul, ol {
      list-style: none;
    }

    /* Primary Color Palette */
    :root {
      --navy-main: #0B1E36;
      --navy-light: #162E4D;
      --ocean-blue: #1C4B82;
      --accent-gold: #C5A059;
      --gold-light: #DFB972;
      --warm-beige: #F4EFEA;
      --soft-bg: #F7F9FA;
      --text-dark: #1F242B;
      --text-muted: #626A74;
      --white: #FFFFFF;
      --border-color: #E2E8F0;
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Section Commons */
    section {
      padding: 90px 0;
    }

    .section-title {
      text-align: center;
      margin-bottom: 50px;
    }

    .section-title .sub-tag {
      display: inline-block;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .section-title h2 {
      font-size: 2.3rem;
      font-weight: 800;
      color: var(--navy-main);
      margin-bottom: 14px;
    }

    .section-title p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 700px;
      margin: 0 auto;
    }

    /* Header & Navigation */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(11, 30, 54, 0.92);
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 20px rgba(0,0,0,0.15);
      transition: all 0.3s ease;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 80px;
    }

    .logo-area a {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--white);
    }

    .logo-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo-sub {
      font-size: 0.85rem;
      color: var(--gold-light);
      border-left: 1px solid rgba(255,255,255,0.2);
      padding-left: 12px;
    }

    nav ul {
      display: flex;
      gap: 32px;
    }

    nav a {
      color: rgba(255,255,255,0.85);
      font-size: 1.05rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--gold-light);
    }

    .header-call {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--accent-gold);
      color: var(--white);
      padding: 10px 22px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.1rem;
      box-shadow: 0 4px 15px rgba(197, 160, 89, 0.4);
      transition: background 0.2s ease;
    }

    .header-call:hover {
      background: var(--gold-light);
    }

    /* Hero Section with Real Background Image */
    .hero {
      position: relative;
      height: 100vh;
      min-height: 720px;
      background: linear-gradient(rgba(11, 30, 54, 0.45), rgba(11, 30, 54, 0.65)), 
                  url('전경_2.jpg') center/cover no-repeat,
                  url('전경.jpg') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--white);
      padding-top: 80px;
    }

    .hero-content {
      max-width: 900px;
      padding: 0 20px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .hero-tag {
      display: inline-block;
      padding: 8px 22px;
      background: rgba(11, 30, 54, 0.6);
      border: 1px solid var(--accent-gold);
      border-radius: 30px;
      color: var(--gold-light);
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 24px;
      backdrop-filter: blur(4px);
    }

    .hero h1 {
      font-size: 3.6rem;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .hero-sub {
      font-size: 1.3rem;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 40px;
      font-weight: 400;
    }

    .hero-btn-group {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--accent-gold);
      color: var(--white);
      padding: 16px 36px;
      border-radius: 8px;
      font-size: 1.15rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(197, 160, 89, 0.4);
      transition: all 0.3s ease;
      text-shadow: none;
    }

    .btn-primary:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(11, 30, 54, 0.6);
      color: var(--white);
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 16px 36px;
      border-radius: 8px;
      font-size: 1.15rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
      text-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: var(--white);
    }

    /* Key Features / Key Metrics */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin-top: -60px;
      position: relative;
      z-index: 10;
    }

    .overview-card {
      background: var(--white);
      padding: 32px 28px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid var(--border-color);
      transition: transform 0.3s ease;
    }

    .overview-card:hover {
      transform: translateY(-5px);
    }

    .card-icon {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: var(--warm-beige);
      color: var(--ocean-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin-bottom: 20px;
    }

    .overview-card h3 {
      font-size: 1.25rem;
      color: var(--navy-main);
      margin-bottom: 10px;
      font-weight: 700;
    }

    .overview-card p {
      font-size: 0.98rem;
      color: var(--text-muted);
    }

    /* Gallery / Real Photos Showcase */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }

    .gallery-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      height: 240px;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.06);
    }

    .gallery-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 14px 18px;
      background: linear-gradient(transparent, rgba(11, 30, 54, 0.88));
      color: var(--white);
      font-weight: 700;
      font-size: 1.02rem;
    }

    /* Experience / 2박3일 체험입주 Highlight */
    .experience-section {
      background: linear-gradient(135deg, var(--navy-main), var(--navy-light));
      color: var(--white);
    }

    .exp-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(223, 185, 114, 0.3);
      border-radius: 16px;
      padding: 48px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .exp-text h3 {
      font-size: 2rem;
      color: var(--gold-light);
      margin-bottom: 16px;
      font-weight: 800;
    }

    .exp-text p {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.85);
      margin-bottom: 24px;
      line-height: 1.8;
    }

    .exp-list {
      margin-bottom: 30px;
    }

    .exp-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.05rem;
      margin-bottom: 12px;
    }

    .exp-list i {
      color: var(--accent-gold);
    }

    .exp-card-inner {
      background: var(--white);
      color: var(--text-dark);
      padding: 32px;
      border-radius: 12px;
      text-align: center;
    }

    .exp-card-inner h4 {
      font-size: 1.4rem;
      color: var(--navy-main);
      margin-bottom: 12px;
    }

    .exp-badge {
      display: inline-block;
      background: var(--warm-beige);
      color: var(--ocean-blue);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    /* Details Grid */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
    }

    .feature-card {
      background: var(--white);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
      transition: all 0.3s ease;
    }

    .feature-card:hover {
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .feature-img {
      height: 220px;
      background-size: cover;
      background-position: center;
    }

    .feature-body {
      padding: 28px;
    }

    .feature-body h3 {
      font-size: 1.3rem;
      color: var(--navy-main);
      margin-bottom: 12px;
      font-weight: 700;
    }

    .feature-body p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Unit Types & Pricing Tabs */
    .price-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 12px 28px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
      background: var(--white);
      color: var(--text-dark);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--navy-main);
      color: var(--white);
      border-color: var(--navy-main);
    }

    .tab-content {
      display: none;
      background: var(--white);
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border: 1px solid var(--border-color);
    }

    .tab-content.active {
      display: block;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.98rem;
    }

    th, td {
      padding: 16px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background: var(--soft-bg);
      color: var(--navy-main);
      font-weight: 700;
    }

    tr:hover {
      background: rgba(244, 239, 234, 0.3);
    }

    /* Contact Form Section */
    .contact-section {
      background: var(--warm-beige);
    }

    .form-wrapper {
      max-width: 750px;
      margin: 0 auto;
      background: var(--white);
      padding: 44px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      color: var(--navy-main);
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--ocean-blue);
    }

    .form-submit-btn {
      width: 100%;
      background: var(--navy-main);
      color: var(--white);
      padding: 18px;
      border: none;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(11, 30, 54, 0.3);
      transition: background 0.2s ease;
    }

    .form-submit-btn:hover {
      background: var(--ocean-blue);
    }

    /* FAQ Section */
    .faq-list {
      max-width: 800px;
      margin: 0 auto;
    }

    .faq-item {
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .faq-question {
      padding: 20px 24px;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--navy-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .faq-answer {
      padding: 0 24px;
      max-height: 0;
      overflow: hidden;
      color: var(--text-muted);
      transition: all 0.3s ease;
      background: var(--soft-bg);
    }

    .faq-item.active .faq-answer {
      padding: 20px 24px;
      max-height: 300px;
    }

    .faq-item.active .faq-question i {
      transform: rotate(180deg);
    }

    /* Footer */
    footer {
      background: var(--navy-main);
      color: rgba(255, 255, 255, 0.7);
      padding: 60px 0 100px;
      font-size: 0.95rem;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 40px;
      flex-wrap: wrap;
      margin-bottom: 40px;
      padding-bottom: 40px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .footer-logo {
      color: var(--white);
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .footer-bottom {
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
    }

    /* Floating CTA Bar */
    .floating-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(11, 30, 54, 0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(197, 160, 89, 0.3);
      padding: 14px 20px;
      z-index: 999;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.2);
    }

    .floating-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .floating-text {
      color: var(--white);
      font-size: 1.15rem;
      font-weight: 700;
    }

    .floating-btns {
      display: flex;
      gap: 12px;
    }

    .float-btn-call {
      background: var(--accent-gold);
      color: var(--white);
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .float-btn-form {
      background: var(--ocean-blue);
      color: var(--white);
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1.05rem;
    }

    /* Responsive Design */
    @media (max-width: 992px) {
      .hero h1 { font-size: 2.6rem; }
      .exp-box { grid-template-columns: 1fr; }
      nav { display: none; }
    }

    @media (max-width: 768px) {
      section { padding: 60px 0; }
      .hero h1 { font-size: 2.1rem; }
      .hero-sub { font-size: 1.1rem; }
      .floating-text { display: none; }
      .floating-btns { width: 100%; }
      .float-btn-call, .float-btn-form { flex: 1; text-align: center; justify-content: center; }
      .form-wrapper { padding: 24px; }
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header>
    <div class="container header-inner">
      <div class="logo-area">
        <a href="#">
          <span class="logo-title">LHOUR</span>
          <span class="logo-sub">라우어 시니어타운
